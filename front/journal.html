<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TradeLog — Journal</title>

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/journal.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>

<body>

    <header class="navbar">

        <a href="./index.html" class="logo">
            TradeLog
        </a>

        <nav class="nav-actions">

            <label class="switch" aria-label="Toggle theme">

                <input type="checkbox" id="themeToggle">

                <span class="thumb">
                    <div class="cranium"></div>
                    <div class="mouth"></div>
                </span>

                <span class="arm-wrapper">
                    <span class="arm">
                        <span class="bone"></span>
                        <span class="bone"></span>

                        <span class="hand">
                            <span class="bone"></span>
                            <span class="bone"></span>
                            <span class="bone"></span>
                            <span class="bone"></span>
                        </span>

                        <span class="big"></span>
                    </span>
                </span>

            </label>

            <span class="nav-divider"></span>

            <div
                class="user-profile"
                id="userProfile"
                tabindex="0"
                role="button"
            >

                <div class="user-profile-inner">

                    <svg
                        aria-hidden="true"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        width="22"
                        height="22"
                    >
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>

                    <p>Profile</p>

                </div>

            </div>

        </nav>

    </header>


    <main class="journal-page">

        <section class="stats-grid">

            <div class="stat-card">
                <span class="stat-label">Balance</span>
                <span class="stat-value" id="balance">$0.00</span>
            </div>

            <div class="stat-card">
                <span class="stat-label">Today P&L</span>
                <span class="stat-value" id="todayPnl">$0.00</span>
            </div>

            <div class="stat-card">
                <span class="stat-label">Win Rate</span>
                <span class="stat-value" id="winRate">0%</span>
            </div>

            <div class="stat-card">
                <span class="stat-label">Total Trades</span>
                <span class="stat-value" id="totalTrades">0</span>
            </div>

        </section>


        <section class="journal-toolbar">

            <div class="toolbar-left">

                <div class="filter-group">

                    <button class="filter-btn active" data-filter="all" type="button">All</button>
                    <button class="filter-btn" data-filter="long" type="button">Long</button>
                    <button class="filter-btn" data-filter="short" type="button">Short</button>
                    <button class="filter-btn" data-filter="win" type="button">Winners</button>
                    <button class="filter-btn" data-filter="loss" type="button">Losers</button>

                </div>

            </div>

            <div class="toolbar-right">

                <input
                    type="text"
                    class="search-input"
                    id="searchInput"
                    placeholder="Search symbol..."
                    autocomplete="off"
                >

            </div>

        </section>


        <section class="table-wrapper">

            <table class="trade-table">

                <thead>

                    <tr class="group-row">

                        <th colspan="17" class="group-trade">
                            <span class="group-icon">⚡</span>
                            TRADE
                        </th>

                        <th colspan="5" class="group-analysis">
                            <span class="group-icon">🧠</span>
                            ANALYSIS
                        </th>

                        <th colspan="5" class="group-result">
                            <span class="group-icon">🛡</span>
                            RISK / RESULT
                        </th>

                    </tr>


                    <tr class="column-row">

                        <!-- TRADE (17) -->

                        <th class="col-num">#</th>
                        <th class="col-day">DAY</th>
                        <th class="col-d">D</th>
                        <th class="col-m">M</th>
                        <th class="col-year">YEAR</th>
                        <th class="col-hh">HH</th>
                        <th class="col-mm">MM</th>
                        <th class="col-symbol">SYMBOL</th>
                        <th class="col-exchange">EXCHANGE</th>
                        <th class="col-tf">TF</th>
                        <th class="col-side">SIDE</th>
                        <th class="col-entry">ENTRY</th>
                        <th class="col-margin">MARGIN</th>
                        <th class="col-lev">LEV</th>
                        <th class="col-ordervalue">O. VALUE</th>
                        <th class="col-ordertype">O. TYPE</th>
                        <th class="col-entsshot">ENTRY 📷</th>

                        <!-- ANALYSIS (5) -->

                        <th class="col-mental">MENTAL</th>
                        <th class="col-strategy">STRATEGY</th>
                        <th class="col-mistakes">MISTAKES</th>
                        <th class="col-check">CHECK</th>
                        <th class="col-analysis">NOTES</th>

                        <!-- RISK / RESULT (5) -->

                        <th class="col-sl">SL</th>
                        <th class="col-tp">TP</th>
                        <th class="col-exitshot">EXIT 📷</th>
                        <th class="col-posacc">POS %</th>
                        <th class="col-pnl">PNL</th>

                    </tr>

                </thead>

                <tbody id="tradeTableBody">

                    <tr>
                        <td colspan="27" class="table-loading">
                            Loading trades...
                        </td>
                    </tr>

                </tbody>

            </table>

        </section>


        <section class="pagination-bar">

            <div class="pagination-controls">

                <button
                    class="page-arrow"
                    id="prevPage"
                    disabled
                    type="button"
                    aria-label="Previous page"
                >
                    ‹
                </button>

                <span class="page-current" id="pageCurrent">1</span>

                <button
                    class="page-arrow"
                    id="nextPage"
                    disabled
                    type="button"
                    aria-label="Next page"
                >
                    ›
                </button>

            </div>

            <div class="pagination-size">

                <select id="pageSize" class="page-size-select" aria-label="Trades per page">

                    <option value="10">10 / page</option>
                    <option value="25">25 / page</option>
                    <option value="50">50 / page</option>
                    <option value="100">100 / page</option>

                </select>

            </div>

        </section>

    </main>

</body>

</html>

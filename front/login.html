<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeLog — Login</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <header class="navbar">
        <a href="/" class="logo">TradeLog</a>

        <nav class="nav-actions">
            <label class="switch" aria-label="Toggle theme">
                <input type="checkbox" id="themeToggle">
                <span class="thumb">
                    <div class="cranium"></div>
                    <div class="mouth"></div>
                </span>
                <span class="arm-wrapper">
                    <span class="arm">
                        <span class="bone"></span>
                        <span class="bone"></span>
                        <span class="hand">
                            <span class="bone"></span>
                            <span class="bone"></span>
                            <span class="bone"></span>
                            <span class="bone"></span>
                        </span>
                        <span class="big"></span>
                    </span>
                </span>
            </label>

            <span class="nav-divider"></span>

            <a href="/" class="user-profile" id="homeButton" aria-label="Home">
                <div class="user-profile-inner">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22">
                        <path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/>
                    </svg>
                    <p>Home</p>
                </div>
            </a>
        </nav>
    </header>

    <main class="login-page">
        <section class="login-card">
            <header class="login-header">
                <h1>Welcome back</h1>
                <p>Sign in to your journal</p>
            </header>

            <button type="button" class="google-button" id="googleLogin">
                <span class="google-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="#4285F4" d="M21.35 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h5.23a4.47 4.47 0 0 1-1.94 2.93v2.45h3.14c1.84-1.69 2.92-4.18 2.92-7.41Z"/>
                        <path fill="#34A853" d="M12 21.75c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.55 0-4.71-1.72-5.49-4.04H3.26v2.53A9.75 9.75 0 0 0 12 21.75Z"/>
                        <path fill="#FBBC05" d="M6.51 13.83A5.86 5.86 0 0 1 6.2 12c0-.64.11-1.26.31-1.83V7.64H3.26A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.01 4.36l3.25-2.53Z"/>
                        <path fill="#EA4335" d="M12 6.13c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.83 3.23 14.63 2.25 12 2.25a9.75 9.75 0 0 0-8.74 5.39l3.25 2.53C7.29 7.85 9.45 6.13 12 6.13Z"/>
                    </svg>
                </span>
                <span>Continue with Google</span>
            </button>

            <div class="login-divider">
                <span></span>
                <p>or</p>
                <span></span>
            </div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 5c-5 0-9.27 3.11-11 7
                                    1.73 3.89 6 7 11 7s9.27-3.11
                                    11-7c-1.73-3.89-6-7-11-7zm0
                                    12a5 5 0 1 1 0-10 5 5 0 0 1
                                    0 10zm0-8a3 3 0 1 0 0 6
                                    3 3 0 0 0 0-6z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <a href="#" class="forgot-password">Forgot password?</a>

                <button type="submit" class="signin-button">Sign in</button>
            </form>

            <div class="create-account">
                <span>Don't have an account?</span>
                <a href="#">Create account</a>
            </div>
        </section>
    </main>

    <script type="module" src="js/login.js"></script>
</body>

</html>
